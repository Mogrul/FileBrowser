[project]
name = "filebrowser"
version = "0.1.0"
description = "A way to view your files from the web."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "flask>=3.1.3",
    "keyring>=25.7.0",
    "opaque-ke-py>=0.1.2",
    "pillow>=13.0.0",
]

[project.scripts]
filebrowser = "filebrowser:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true
