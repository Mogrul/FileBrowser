<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ branding.name }}</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <main class="page">
        <section class="container">
            <header class="brand">
                <div class="brand-icon" aria-hidden="true">
                    <i class="{{ branding.icon_class }}"></i>
                </div>

                <h1>{{ branding.name }}</h1>
            </header>

            <form id="form" class="card" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Username"
                        autocomplete="off"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="off"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="login-button"
                    name="action"
                    value="login"
                    id="login-button"
                >
                    Sign in
                    <span aria-hidden="true">➔</span>
                </button>

                <button
                    type="submit"
                    class="register-button"
                    name="action"
                    value="register"
                    id="register-button"
                >
                    Create an account
                </button>

                <p id="message" class="message" role="alert"></p>
            </form>

            <footer class="footer">
                A Secure OPAQUE Login
            </footer>
        </section>
    </main>

    <script type="module" src="{{ get_ts('pages/login.ts') }}" defer></script>
</body>
</html>
